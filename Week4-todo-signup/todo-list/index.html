<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="app__header">
      <h1 class="app__title">To-Do List</h1>
      <button
        type="button"
        id="theme-toggle-btn"
        class="theme-toggle"
        aria-label="다크모드 전환"
      >🌙</button>
    </div>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-form__input"
        placeholder="할 일을 입력하세요"
        maxlength="100"
        autocomplete="off"
      />
      <div class="todo-form__row">
        <select id="todo-priority" class="todo-form__select" aria-label="우선순위">
          <option value="low">낮음</option>
          <option value="medium" selected>보통</option>
          <option value="high">높음</option>
        </select>
        <input
          type="date"
          id="todo-due-date"
          class="todo-form__date"
          aria-label="마감일"
        />
        <button type="submit" class="todo-form__button">추가</button>
      </div>
    </form>

    <p id="todo-message" class="todo-message" role="alert"></p>

    <div class="todo-toolbar">
      <div id="todo-filters" class="todo-filters" role="tablist">
        <button type="button" class="todo-filters__btn is-active" data-filter="all">전체</button>
        <button type="button" class="todo-filters__btn" data-filter="active">진행중</button>
        <button type="button" class="todo-filters__btn" data-filter="done">완료</button>
      </div>
      <p id="todo-remaining" class="todo-remaining"></p>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="todo-empty" class="todo-empty">등록된 일정이 없습니다.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
