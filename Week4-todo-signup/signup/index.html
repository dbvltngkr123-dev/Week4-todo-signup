<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="app__title">회원가입</h1>

    <form id="signup-form" class="signup-form" novalidate>
      <div class="field">
        <label for="user-id" class="field__label">아이디</label>
        <div class="field__row">
          <input
            type="text"
            id="user-id"
            class="field__input"
            placeholder="영문/숫자 4~12자"
            autocomplete="off"
          />
          <button type="button" id="check-id-btn" class="field__button">
            중복 확인
          </button>
        </div>
        <p id="id-message" class="field__message" role="alert"></p>
      </div>

      <div class="field">
        <label for="password" class="field__label">비밀번호</label>
        <input
          type="password"
          id="password"
          class="field__input"
          placeholder="8~20자, 영문/숫자/특수문자 포함"
          autocomplete="new-password"
        />
        <p id="password-message" class="field__message" role="alert"></p>
      </div>

      <div class="field">
        <label for="password-confirm" class="field__label">비밀번호 확인</label>
        <input
          type="password"
          id="password-confirm"
          class="field__input"
          placeholder="비밀번호를 다시 입력하세요"
          autocomplete="new-password"
        />
        <p id="password-confirm-message" class="field__message" role="alert"></p>
      </div>

      <button type="submit" class="signup-form__submit">가입하기</button>

      <p id="result-message" class="result-message" role="status"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
